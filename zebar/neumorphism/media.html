<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <title>Media</title>
  </head>
  <body>
    <div class="island" id="island">
      <span class="icon" id="icon-media">&#xf001;</span>
      <span class="value" id="media"></span>
      <span class="meter" id="meter-media"><span class="meter-fill"></span></span>
    </div>
    <script type="module">
      import { zebar, el, setText, setVisible, meter, formatSpeed, truncate } from "./core.js";

    const providers = zebar.createProviderGroup({ media: { type: "media", refreshInterval: 2000 } });
    function render(o) {
      const s = o.media?.currentSession;
      if (!s?.title) { setVisible("island", false); return; }
      const artist = s.artist ? `${s.artist} \u2013 ` : "";
      setText("media", truncate(`${artist}${s.title}`, 24));
      setVisible("island", true);
    }
    render(providers.outputMap);
    providers.onOutput(() => render(providers.outputMap));
    el("island").addEventListener("click", () => providers.outputMap.media?.togglePlayPause());
    </script>
  </body>
</html>
