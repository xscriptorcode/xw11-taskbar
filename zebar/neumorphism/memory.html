<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <title>Memory</title>
  </head>
  <body>
    <div class="island" id="island">
      <span class="icon" id="icon-memory">&#xefc5;</span>
      <span class="value" id="memory"></span>
      <span class="meter" id="meter-memory"><span class="meter-fill"></span></span>
    </div>
    <script type="module">
      import { zebar, el, setText, setVisible, meter, formatSpeed, truncate } from "./core.js";

    const providers = zebar.createProviderGroup({ memory: { type: "memory" } });
    function render(o) {
      const v = o.memory?.usage;
      setText("memory", v !== undefined ? `${Math.round(v)}%` : "\u2014");
      meter("meter-memory", v ?? 0);
    }
    render(providers.outputMap);
    providers.onOutput(() => render(providers.outputMap));
    </script>
  </body>
</html>
