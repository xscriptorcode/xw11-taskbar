<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <title>Disk</title>
  </head>
  <body>
    <div class="island" id="island">
      <span class="icon" id="icon-disk">&#xf0a0;</span>
      <span class="value" id="disk"></span>
      <span class="meter" id="meter-disk"><span class="meter-fill"></span></span>
    </div>
    <script type="module">
      import { zebar, el, setText, setVisible, meter, formatSpeed, truncate } from "./core.js";

    const providers = zebar.createProviderGroup({ disk: { type: "disk", refreshInterval: 10000 } });
    function render(o) {
      const disks = o.disk?.disks ?? [];
      const main = disks.filter((d) => !d.isRemovable).sort((a, b) => b.totalSpace.bytes - a.totalSpace.bytes)[0];
      if (!main || main.totalSpace.bytes === 0) { setVisible("island", false); return; }
      const used = ((main.totalSpace.bytes - main.availableSpace.bytes) / main.totalSpace.bytes) * 100;
      setText("disk", `${Math.round(used)}%`);
      meter("meter-disk", used);
      setVisible("island", true);
    }
    render(providers.outputMap);
    providers.onOutput(() => render(providers.outputMap));
    </script>
  </body>
</html>
