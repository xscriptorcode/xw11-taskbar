<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <title>Theme</title>
  </head>
  <body>
    <div class="island" id="island-theme">
      <span class="icon" id="icon-theme">&#xf1fc;</span>
      <span class="value dim" id="theme-name"></span>
    </div>
    <script type="module">
      import { el, setText, PALETTES, currentTheme, applyTheme } from "./core.js";

      let current = currentTheme();
      setText("theme-name", current.name);

      el("island-theme").addEventListener("click", () => {
        const index = PALETTES.findIndex((t) => t.id === current.id);
        current = applyTheme(PALETTES[(index + 1) % PALETTES.length].id);
        setText("theme-name", current.name);
      });
    </script>
  </body>
</html>
